services:
  mysql:
    image: mysql:8.0
    container_name: jobhunter-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobhunter
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jobhunter-network

  minio:
    image: minio/minio
    container_name: jobhunter-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - jobhunter-network

networks:
  jobhunter-network:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
